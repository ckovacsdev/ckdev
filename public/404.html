<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Christian Kovacs</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Chakra+Petch:wght@500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0b;
        --panel: #111113;
        --line: rgb(255 255 255 / 0.08);
        --line-strong: rgb(255 255 255 / 0.14);
        --text: #ededef;
        --text-muted: #a1a1aa;
        --accent: rgb(20 200 180);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Geist', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100%;
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        border-inline: 1px solid var(--line);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-family: 'Chakra Petch', system-ui, sans-serif;
        font-weight: 500;
        font-size: clamp(56px, 16vw, 96px);
        letter-spacing: -0.04em;
        line-height: 1;
      }
      p {
        margin: 0;
        color: var(--text-muted);
        font-size: 16px;
      }
      a {
        margin-top: 10px;
        padding: 8px 14px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: border-color 0.2s ease;
      }
      a:hover { border-color: rgb(255 255 255 / 0.24); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @media (max-width: 792px) { main { border-inline: 0; } }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page doesn't exist.</p>
      <a href="/">Back to Home</a>
    </main>
  </body>
</html>
